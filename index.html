<!DOCTYPE html>

<html lang="ja" style="background:#0c0b0e">
<head>
<meta charset="UTF-8">

<title>Outfit Architect: Female Edition</title>
<style>

  :root{
    --bg:#0c0b0e;--panel:#131118;--border:#22202a;--border2:#332f40;
    --text:#d4cee0;--muted:#6a6278;--dim:#2a2535;
    --spring:#f9a8d4;--summer:#86efac;--autumn:#fcd34d;--winter:#93c5fd;
    --mono:'DM Mono',monospace;--serif:'DM Serif Display',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#0c0b0e}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 60px}
  header{text-align:center;margin-bottom:36px}
  .eyebrow{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  h1{font-family:var(--serif);font-style:italic;font-size:clamp(26px,5vw,42px);color:#fff;font-weight:400;line-height:1.1;margin-bottom:4px}
  h1 span{color:var(--spring)}
  .counter{font-size:10px;color:var(--dim);margin-top:8px;letter-spacing:.2em}
  .season-selector{display:flex;gap:8px;margin-bottom:24px;width:100%;max-width:560px}
  .season-btn{flex:1;padding:10px 0;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .2s}
  .season-btn:hover{border-color:var(--border2);color:var(--text)}
  .season-btn.active-spring{border-color:var(--spring);color:var(--spring);background:#1a0f14}
  .season-btn.active-summer{border-color:var(--summer);color:var(--summer);background:#0f1a12}
  .season-btn.active-autumn{border-color:var(--autumn);color:var(--autumn);background:#1a1710}
  .season-btn.active-winter{border-color:var(--winter);color:var(--winter);background:#0f1218}
  .card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--border);padding:32px;margin-bottom:20px}
  .empty-state{text-align:center;padding:40px 0;color:var(--dim)}
  .empty-icon{font-size:40px;margin-bottom:12px;opacity:.5}
  .empty-text{font-size:12px;line-height:1.7;letter-spacing:.05em}
  .fields{display:flex;flex-direction:column;gap:16px;margin-bottom:28px}
  .field{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:start}
  .field-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding-top:4px;line-height:1.4}
  .field-value{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.4}
  .rare-badge{font-family:var(--mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;opacity:.6;margin-left:8px;vertical-align:middle;font-style:normal}
  .divider{border:none;border-top:1px solid var(--border);margin-bottom:20px}
  .prompt-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .prompt-text{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:14px;word-break:break-word}
  .copy-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);padding:7px 18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .15s}
  .copy-btn:hover{border-color:var(--spring);color:var(--spring)}
  .copy-btn.copied{border-color:var(--summer);color:var(--summer)}
  .generate-btn{width:100%;max-width:560px;background:transparent;border:1px solid #3a2a4a;color:var(--spring);padding:16px;font-size:11px;letter-spacing:.35em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .2s;margin-bottom:12px}
  .generate-btn:hover{background:#1a0f18;border-color:var(--spring)}
  .save-btn{width:100%;max-width:560px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:12px;font-size:10px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;font-family:var(--mono);transition:all .2s;margin-bottom:40px}
  .save-btn:hover{border-color:var(--border2);color:var(--text)}
  .saved-section{width:100%;max-width:560px}
  .saved-title{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .saved-item{background:var(--panel);border:1px solid var(--border);padding:12px 16px;margin-bottom:8px;font-size:11px;color:var(--muted);line-height:1.7;cursor:pointer;transition:border-color .15s}
  .saved-item:hover{border-color:var(--border2);color:var(--text)}
  footer{margin-top:20px;font-size:10px;color:var(--dim);letter-spacing:.15em;text-align:center}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .animate-in{animation:fadeIn .3s ease forwards}
</style>

<header>

  <button class="season-btn" data-season="autumn" onclick="setSeason('autumn')">🍂 Autumn</button>
  <button class="season-btn" data-season="winter" onclick="setSeason('winter')">❄️ Winter</button>
</div>

<div class="card">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">👗</div>
    <div class="empty-text">季節を選んでボタンを押してください<br>画像生成AIに使えるプロンプトが生成されます</div>
  </div>
  <div id="result" style="display:none"></div>
</div>

<button class="generate-btn" onclick="generate()">GENERATE OUTFIT</button>
<button class="save-btn" onclick="savePrompt()" id="saveBtn" style="display:none">SAVE THIS PROMPT</button>

<div class="saved-section" id="savedSection" style="display:none">
  <div class="saved-title">Saved Prompts</div>
  <div id="savedList"></div>
</div>

<footer>100 × 100 × 100 × 100 patterns · seasonal logic · GitHub Pages ready</footer>

function generate() {
  generated++;
  document.getElementById("counter").textContent = `${generated} generated`;

  const style = pick(STYLES);
  const top = pick(TOPS);
  const bottom = pick(BOTTOMS);
  const fabric = pick(FABRICS);
  const colorPalette = pick(COLORS[currentSeason]);
  const acc = pickN(ACCESSORIES, Math.random() < 0.5 ? 2 : 3);
  const shoe = pick(SHOES);

  // Outerwear logic
  let outer = null;
  if (currentSeason === "summer") {
    outer = null;
  } else if (currentSeason === "winter") {
    outer = pick(OUTERWEAR.winter);
  } else {
    // spring/autumn: 50% chance
    if (Math.random() < 0.5) {
      outer = pick(OUTERWEAR[currentSeason]);
    }
  }

  const seasonLabel = { spring: "Spring", summer: "Summer", autumn: "Autumn", winter: "Winter" }[currentSeason];

  // Build prompt
  const parts = [`${seasonLabel} outfit`];
  parts.push(style);
  parts.push(top);
  parts.push(bottom);
  if (outer) parts.push(outer);
  parts.push(`${fabric} fabric`);
  parts.push(`color palette: ${colorPalette}`);
  parts.push(acc.join(", "));
  parts.push(shoe);
  parts.push("full body shot, fashion photography, detailed clothing");
  currentPrompt = parts.join(", ");

  const accentColor = SEASON_COLORS[currentSeason];

  const fields = [
    { label: "スタイル", value: style, color: FIELD_COLORS[0] },
    { label: "トップス", value: top, color: FIELD_COLORS[1] },
    { label: "ボトムス", value: bottom, color: FIELD_COLORS[2] },
  ];
  if (outer) fields.push({ label: "アウター", value: outer, color: accentColor, rare: currentSeason !== "winter" });
  fields.push(
    { label: "素材", value: fabric, color: FIELD_COLORS[3] },
    { label: "カラー", value: colorPalette, color: accentColor },
    { label: "アクセサリー", value: acc.join(", "), color: FIELD_COLORS[5] },
    { label: "シューズ", value: shoe, color: FIELD_COLORS[6] }
  );

  const fieldsHTML = fields.map(f => `
    <div class="field">
      <div class="field-label">${f.label}</div>
      <div class="field-value" style="color:${f.color}">
        ${f.value}${f.rare ? `<span class="rare-badge" style="color:${f.color}">seasonal</span>` : ""}
      </div>
    </div>
  `).join("");

  document.getElementById("result").innerHTML = `
    <div class="fields animate-in">${fieldsHTML}</div>
    <hr class="divider">
    <div class="prompt-label">画像AIにコピー</div>
    <div class="prompt-text">${currentPrompt}</div>
    <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
  `;

  document.getElementById("emptyState").style.display = "none";
  document.getElementById("result").style.display = "block";
  document.getElementById("saveBtn").style.display = "block";
}

function copyPrompt() {
  if (!currentPrompt) return;
  navigator.clipboard.writeText(currentPrompt).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copied ✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 2000);
  });
}

function savePrompt() {
  if (!currentPrompt) return;
  let saved = JSON.parse(localStorage.getItem("outfit_arch_v1") || "[]");
  if (saved.includes(currentPrompt)) return;
  saved.unshift(currentPrompt);
  localStorage.setItem("outfit_arch_v1", JSON.stringify(saved.slice(0, 30)));
  renderSaved();
}

function renderSaved() {
  const saved = JSON.parse(localStorage.getItem("outfit_arch_v1") || "[]");
  const section = document.getElementById("savedSection");
  const list = document.getElementById("savedList");
  if (saved.length === 0) { section.style.display = "none"; return; }
  section.style.display = "block";
  list.innerHTML = saved.map((p, i) => `<div class="saved-item" data-index="${i}">${p}</div>`).join("");
  document.querySelectorAll(".saved-item").forEach(el => {
    el.onclick = () => navigator.clipboard.writeText(saved[el.dataset.index]);
  });
}

renderSaved();
</script>

</body>
</html>
